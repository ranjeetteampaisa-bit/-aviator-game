balance">
 Balance: 🪙 <span id="balance">10000</span> Coins
</div>

<div class="game">
 <div id="multiplier">1.00x</div>
 <div id="plane">✈️</div>
</div>

<div class="controls">

<h3>PLACE YOUR BET</h3>

<input id="bet" type="number" value="100" min="1">

<button id="play" onclick="startGame()">
 START ROUND
</button>

<button id="cash" onclick="cashOut()" disabled>
 CASH OUT
</button>

<button id="reset" onclick="resetGame()">
 RESET GAME
</button>

<p id="message">Ready to Play!</p>

</div>

<div class="history">
<h3>ROUND HISTORY</h3>
<div id="history"></div>
</div>

<script>

let balance=10000;
let multiplier=1;
let crashPoint=0;
let playing=false;
let cashed=false;
let betAmount=0;
let timer=null;
let startTime=0;

function updateBalance(){
 document.getElementById("balance").innerText=balance;
}

function startGame(){

 if(playing)return;

 betAmount=Number(document.getElementById("bet").value);

 if(!Number.isFinite(betAmount)||betAmount<=0||betAmount>balance){
  document.getElementById("message").innerText="Invalid Bet!";
  return;
 }

 balance-=betAmount;
 updateBalance();

 multiplier=1;
 cashed=false;
 playing=true;

 crashPoint=Number((1+Math.random()*5).toFixed(2));

 startTime=Date.now();

 document.getElementById("multiplier").innerText="1.00x";
 document.getElementById("plane").style.left="15px";
 document.getElementById("play").disabled=true;
 document.getElementById("cash").disabled=false;
 document.getElementById("message").innerText="Plane is Flying!";

 timer=setInterval(updateGame,50);
}

function updateGame(){

 let seconds=(Date.now()-startTime)/1000;

 multiplier=Math.exp(seconds*0.20);

 document.getElementById("multiplier").innerText=
 multiplier.toFixed(2)+"x";

 let plane=document.getElementById("plane");
 let distance=Math.min(75,seconds*5);
 plane.style.left=distance+"%";
 plane.style.bottom=(30+seconds*8)+"px";

 if(multiplier>=crashPoint){
  crash();
 }
}

function cashOut(){

 if(!playing||cashed)return;

 cashed=true;

 let winnings=Math.floor(betAmount*multiplier);

 balance+=winnings;
 updateBalance();

 document.getElementById("message").innerText=
 "CASHED OUT! +" + winnings + " Coins";

 document.getElementById("cash").disabled=true;
}

function crash(){

 clearInterval(timer);
 playing=false;

 document.getElementById("multiplier").innerText=
 crashPoint.toFixed(2)+"x";

 if(!cashed){
  document.getElementById("message").innerText=
  "CRASHED! Bet Lost";
 }else{
  document.getElementById("message").innerText=
  "Round Finished! You Won!";
 }

 addHistory(crashPoint);

 document.getElementById("play").disabled=false;
 document.getElementById("cash").disabled=true;
}

function addHistory(value){

 let item=document.createElement("span");
 item.innerText=value.toFixed(2)+"x";

 document.getElementById("history").prepend(item);

 if(document.getElementById("history").children.length>15){
  document.getElementById("history").lastChild.remove();
 }
}

function resetGame(){

 if(playing){
  clearInterval(timer);
  playing=false;
 }

 balance=10000;
 multiplier=1;
 cashed=false;

 updateBalance();

 document.getElementById("multiplier").innerText="1.00x";
 document.getElementById("plane").style.left="15px";
 document.getElementById("plane").style.bottom="30px";
 document.getElementById("message").innerText="Game Reset!";
 document.getElementById("play").disabled=false;
 document.getElementById("cash").disabled=true;
}

updateBalance();

</script>

</body>
</html>
